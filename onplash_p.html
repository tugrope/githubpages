    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        background-color: #f4f7f6;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px 20px;
        color: #333;
        margin: 0;
      }
      .card {
        background: #ffffff;
        padding: 25px 20px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        width: 100%;
        max-width: 480px;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 4px 0;
        color: #2c3e50;
      }
      .button-group {
        display: flex;
        justify-content: center;
        gap: 12px;
      }
      button {
        padding: 10px 24px;
        font-size: 1rem;
        font-weight: bold;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
        flex: 1;
        max-width: 150px;
      }
      #btnStart {
        background-color: #2eb85c;
        color: white;
      }
      #btnStart:hover {
        background-color: #259d4e;
      }
      #btnStart:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }
      #btnStop {
        background-color: #e55353;
        color: white;
      }
      #btnStop:hover {
        background-color: #d93737;
      }
      #btnStop:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }
      .input-group {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        font-size: 0.95rem;
        flex-wrap: wrap;
      }
      input[type="number"] {
        width: 70px;
        padding: 8px;
        font-size: 1rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        text-align: center;
      }
      .timer-inputs {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .timer-inputs input[type="number"] {
        width: 60px;
      }

      .timer-display {
        font-size: 1.6rem;
        font-weight: bold;
        color: #2c3e50;
        margin: 4px 0;
        font-variant-numeric: tabular-nums;
      }

      .score-container {
        position: relative;
        width: 100%;
      }
      #scoreArea {
        width: 100%;
        aspect-ratio: 280 / 265;
        background: #fafafa;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        padding: 10px;
      }
      #scoreArea svg {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }

      .message-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(255, 255, 255, 0.95);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.4rem;
        font-weight: bold;
        color: #e55353;
        text-align: center;
        padding: 20px;
        border-radius: 8px;
        z-index: 10;
        line-height: 1.4;
        white-space: pre-line;
      }
      .hidden {
        display: none !important;
      }

      .controls {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 4px;
      }
      .setting-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        background: #f8f9fa;
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid #e9ecef;
      }
      .setting-title {
        font-size: 0.8rem;
        font-weight: bold;
        color: #6c757d;
        text-align: left;
      }
      .setting-title.mt-sm {
        margin-top: 4px;
      }
      .radio-group {
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
      }
      .radio-group.vertical {
        flex-direction: column;
        align-items: flex-start;
        width: fit-content;
        margin: 0 auto;
        gap: 6px;
      }
      .radio-group.gap-md {
        gap: 18px;
      }
      .radio-group.mb-sm {
        margin-bottom: 6px;
      }
      .radio-group label {
        font-size: 0.9rem;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .label-ml-sm {
        margin-left: 6px;
      }

      .footer {
        font-size: 0.8rem;
        color: #7f8c8d;
        margin-top: 8px;
        padding-top: 12px;
        border-top: 1px solid #eee;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>ONPLAsh</h1>

      <!-- BPMの設定エリア -->
      <div class="input-group">
        <label for="bpm">テンポ (BPM):</label>
        <input type="number" id="bpm" min="30" max="240" step="1" value="50" />
      </div>

      <!-- タイマー設定エリア -->
      <div class="input-group">
        <label>タイマー設定 (0で無制限):</label>
        <div class="timer-inputs">
          <input
            type="number"
            id="timerMinutes"
            min="0"
            max="60"
            step="1"
            value="1"
          />
          分
          <input
            type="number"
            id="timerSeconds"
            min="0"
            max="59"
            step="1"
            value="0"
          />
          秒
        </div>
      </div>

      <!-- スタート / ストップ ボタン -->
      <div class="button-group">
        <button id="btnStart">スタート</button>
        <button id="btnStop" disabled>ストップ</button>
      </div>

      <!-- タイマーカウンター表示 -->
      <div id="timerDisplay" class="timer-display">01分:00秒</div>

      <div class="score-container">
        <div id="scoreArea"></div>
        <div id="messageOverlay" class="message-overlay hidden"></div>
      </div>

      <div class="controls">
        <div class="setting-group">
          <div class="setting-title">フレット範囲</div>
          <div class="radio-group vertical">
            <label
              ><input type="radio" name="course" value="beginner" checked /> 6弦
              3F 〜 1弦 5F</label
            >
            <label
              ><input type="radio" name="course" value="elementary" /> 6弦開放
              〜 1弦12F</label
            >
            <label
              ><input type="radio" name="course" value="intermediate" /> 6弦開放
              〜 1弦22F</label
            >
          </div>
        </div>

        <div class="setting-group">
          <div class="setting-title">弦の指定</div>
          <div class="radio-group mb-sm">
            <label
              ><input type="radio" name="guitarString" value="all" checked />
              指定なし</label
            >
          </div>
          <div class="radio-group mb-sm gap-md">
            <label
              ><input type="radio" name="guitarString" value="6" /> 6弦</label
            >
            <label
              ><input type="radio" name="guitarString" value="5" /> 5弦</label
            >
            <label
              ><input type="radio" name="guitarString" value="4" /> 4弦</label
            >
          </div>
          <div class="radio-group gap-md">
            <label
              ><input type="radio" name="guitarString" value="3" /> 3弦</label
            >
            <label
              ><input type="radio" name="guitarString" value="2" /> 2弦</label
            >
            <label
              ><input type="radio" name="guitarString" value="1" /> 1弦</label
            >
          </div>
        </div>

        <div class="setting-group">
          <div class="setting-title">出題音</div>
          <div class="radio-group mb-sm">
            <label
              ><input type="radio" name="mode" value="natural" checked />
              白鍵だけ</label
            >
            <label
              ><input type="radio" name="mode" value="all" /> 白鍵と黒鍵</label
            >
          </div>

          <div class="setting-title mt-sm">線の音・間の音</div>
          <div class="radio-group mb-sm">
            <label
              ><input type="radio" name="lineSpace" value="all" checked />
              線と間</label
            >
            <label
              ><input type="radio" name="lineSpace" value="line" />
              線のみ</label
            >
            <label
              ><input type="radio" name="lineSpace" value="space" />
              間のみ</label
            >
          </div>

          <div class="setting-title mt-sm">最大音程</div>
          <div class="radio-group">
            <label
              ><input type="radio" name="maxInterval" value="all" checked />
              制限なし</label
            >
            <label
              ><input type="radio" name="maxInterval" value="1oct" />
              1オクターブ</label
            >
          </div>
        </div>

        <div class="setting-group">
          <div class="setting-title">オプション</div>
          <div class="radio-group mb-sm">
            <label><input type="checkbox" id="showDoremi" /> ド表示</label>
            <label><input type="checkbox" id="showAlphabet" /> C表示</label>
          </div>

          <div class="setting-title mt-sm">表示音数</div>
          <div class="radio-group mb-sm">
            <label
              ><input type="radio" name="noteCount" value="1" checked />
              1音</label
            >
            <label><input type="radio" name="noteCount" value="2" /> 2音</label>
            <label><input type="radio" name="noteCount" value="3" /> 3音</label>
            <label><input type="radio" name="noteCount" value="4" /> 4音</label>
          </div>

          <div class="setting-title mt-sm">切り替え頻度</div>
          <div class="radio-group">
            <label
              ><input type="radio" name="beatFreq" value="1" /> 1拍ごと</label
            >
            <label
              ><input type="radio" name="beatFreq" value="2" checked />
              2拍ごと</label
            >
            <label
              ><input type="radio" name="beatFreq" value="4" /> 4拍ごと</label
            >
          </div>
        </div>

        <div class="setting-group">
          <div class="setting-title">サウンド設定</div>
          <div class="radio-group">
            <label
              ><input type="radio" name="soundType" value="click" checked />
              クリック音</label
            >
            <label
              ><input type="radio" name="soundType" value="pitch" /> 実音</label
            >
            <label class="label-ml-sm"
              ><input type="checkbox" id="muteSound" /> ミュート</label
            >
          </div>
        </div>
      </div>
      <footer class="footer">Designed by tugrope | © 2026</footer>
    </div>
