<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONPLAsh</title>

  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"
    integrity="sha384-NOpv0+9OuhqtqeXLSoULPF4d3UCwlWkmcHkJklpAosC7LpqYvhFCFqqu9QElzbjS"
    crossorigin="anonymous"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
      color: #333;
      margin: 0;
    }

    .card {
      background: #ffffff;
      padding: 25px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 480px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    h1 {
      font-size: 1.4rem;
      margin: 0 0 4px 0;
      color: #2c3e50;
    }

    .button-group {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    button {
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      flex: 1;
      max-width: 150px;
    }

    #btnStart {
      background-color: #2eb85c;
      color: white;
    }

    #btnStart:hover {
      background-color: #259d4e;
    }

    #btnStart:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    #btnStop {
      background-color: #e55353;
      color: white;
    }

    #btnStop:hover {
      background-color: #d93737;
    }

    #btnStop:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .input-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      flex-wrap: wrap;
    }

    input[type="number"] {
      width: 70px;
      padding: 8px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      text-align: center;
    }

    .timer-inputs {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .timer-inputs input[type="number"] {
      width: 60px;
    }

    .timer-display {
      font-size: 1.6rem;
      font-weight: bold;
      color: #2c3e50;
      margin: 4px 0;
      font-variant-numeric: tabular-nums;
    }

    .score-container {
      position: relative;
      width: 100%;
    }

    #scoreArea {
      width: 100%;
      aspect-ratio: 280 / 265;
      background: #fafafa;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 10px;
    }

    #scoreArea svg {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    .message-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.4rem;
      font-weight: bold;
      color: #e55353;
      text-align: center;
      padding: 20px;
      border-radius: 8px;
      z-index: 10;
      line-height: 1.4;
      white-space: pre-line;
    }

    .hidden {
      display: none !important;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 4px;
    }

    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #f8f9fa;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #e9ecef;
    }

    .setting-title {
      font-size: 0.8rem;
      font-weight: bold;
      color: #6c757d;
      text-align: left;
    }

    .setting-title.mt-sm {
      margin-top: 4px;
    }

    .radio-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .radio-group.vertical {
      flex-direction: column;
      align-items: flex-start;
      width: fit-content;
      margin: 0 auto;
      gap: 6px;
    }

    .radio-group.gap-md {
      gap: 18px;
    }

    .radio-group.mb-sm {
      margin-bottom: 6px;
    }

    .radio-group label {
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .label-ml-sm {
      margin-left: 6px;
    }

    .footer {
      font-size: 0.8rem;
      color: #7f8c8d;
      margin-top: 8px;
      padding-top: 12px;
      border-top: 1px solid #eee;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>ONPLAsh</h1>

    <!-- BPMの設定エリア -->
    <div class="input-group">
      <label for="bpm">テンポ (BPM):</label>
      <input type="number" id="bpm" min="30" max="240" step="1" value="50" />
    </div>

    <!-- タイマー設定エリア -->
    <div class="input-group">
      <label>タイマー設定 (0で無制限):</label>
      <div class="timer-inputs">
        <input type="number" id="timerMinutes" min="0" max="60" step="1" value="1" />
        分
        <input type="number" id="timerSeconds" min="0" max="59" step="1" value="0" />
        秒
      </div>
    </div>

    <!-- スタート / ストップ ボタン -->
    <div class="button-group">
      <button id="btnStart">スタート</button>
      <button id="btnStop" disabled>ストップ</button>
    </div>

    <!-- タイマーカウンター表示 -->
    <div id="timerDisplay" class="timer-display">01分:00秒</div>

    <div class="score-container">
      <div id="scoreArea"></div>
      <div id="messageOverlay" class="message-overlay hidden"></div>
    </div>

    <div class="controls">
      <div class="setting-group">
        <div class="setting-title">フレット範囲</div>
        <div class="radio-group vertical">
          <label><input type="radio" name="course" value="beginner" checked /> 6弦
            3F 〜 1弦 5F</label>
          <label><input type="radio" name="course" value="elementary" /> 6弦開放
            〜 1弦12F</label>
          <label><input type="radio" name="course" value="intermediate" /> 6弦開放
            〜 1弦22F</label>
        </div>
      </div>

      <div class="setting-group">
        <div class="setting-title">弦の指定</div>
        <div class="radio-group mb-sm">
          <label><input type="radio" name="guitarString" value="all" checked />
            指定なし</label>
        </div>
        <div class="radio-group mb-sm gap-md">
          <label><input type="radio" name="guitarString" value="6" /> 6弦</label>
          <label><input type="radio" name="guitarString" value="5" /> 5弦</label>
          <label><input type="radio" name="guitarString" value="4" /> 4弦</label>
        </div>
        <div class="radio-group gap-md">
          <label><input type="radio" name="guitarString" value="3" /> 3弦</label>
          <label><input type="radio" name="guitarString" value="2" /> 2弦</label>
          <label><input type="radio" name="guitarString" value="1" /> 1弦</label>
        </div>
      </div>

      <div class="setting-group">
        <div class="setting-title">出題音</div>
        <div class="radio-group mb-sm">
          <label><input type="radio" name="mode" value="natural" checked />
            白鍵だけ</label>
          <label><input type="radio" name="mode" value="all" /> 白鍵と黒鍵</label>
        </div>

        <div class="setting-title mt-sm">線の音・間の音</div>
        <div class="radio-group mb-sm">
          <label><input type="radio" name="lineSpace" value="all" checked />
            線と間</label>
          <label><input type="radio" name="lineSpace" value="line" />
            線のみ</label>
          <label><input type="radio" name="lineSpace" value="space" />
            間のみ</label>
        </div>

        <div class="setting-title mt-sm">最大音程</div>
        <div class="radio-group">
          <label><input type="radio" name="maxInterval" value="all" checked />
            制限なし</label>
          <label><input type="radio" name="maxInterval" value="1oct" />
            1オクターブ</label>
        </div>
      </div>

      <div class="setting-group">
        <div class="setting-title">オプション</div>
        <div class="radio-group mb-sm">
          <label><input type="checkbox" id="showDoremi" /> ド表示</label>
          <label><input type="checkbox" id="showAlphabet" /> C表示</label>
        </div>

        <div class="setting-title mt-sm">表示音数</div>
        <div class="radio-group mb-sm">
          <label><input type="radio" name="noteCount" value="1" checked />
            1音</label>
          <label><input type="radio" name="noteCount" value="2" /> 2音</label>
          <label><input type="radio" name="noteCount" value="3" /> 3音</label>
          <label><input type="radio" name="noteCount" value="4" /> 4音</label>
        </div>

        <div class="setting-title mt-sm">切り替え頻度</div>
        <div class="radio-group">
          <label><input type="radio" name="beatFreq" value="1" /> 1拍ごと</label>
          <label><input type="radio" name="beatFreq" value="2" checked />
            2拍ごと</label>
          <label><input type="radio" name="beatFreq" value="4" /> 4拍ごと</label>
        </div>
      </div>

      <div class="setting-group">
        <div class="setting-title">サウンド設定</div>
        <div class="radio-group">
          <label><input type="radio" name="soundType" value="click" checked />
            クリック音</label>
          <label><input type="radio" name="soundType" value="pitch" /> 実音</label>
          <label class="label-ml-sm"><input type="checkbox" id="muteSound" /> ミュート</label>
        </div>
      </div>
    </div>
    <footer class="footer">Designed by tugrope | © 2026</footer>
  </div>

  <script>
    // ==========================================
    // 定数・マスターデータの定義
    // ==========================================
    const finishMessages = [
      "おつかれさま！",
      "がんばったね！",
      "調子はどう？",
      "焦らないでね！\nゆっくり行こうよ。",
      "音楽は1日してならずじゃ。",
      "競争じゃないからね、音楽は。",
      "大丈夫、君は進歩しているから。",
      "細く長く続けようね、一緒に。",
      "Mateus Asatoが弾いてる！\nって思ったよ。",
      "George Bensonは\n譜読ができなかったらしいよ。",
      "君はRitchie Blackmoreかい？",
      "石の上にも、\nギターにも三年だよ。",
    ];

    const DOREMI_MAP = {
      c: "ド",
      d: "レ",
      e: "ミ",
      f: "ファ",
      g: "ソ",
      a: "ラ",
      b: "シ",
    };
    const ACCIDENTAL_SYMBOLS = { "#": "♯", b: "♭" };
    const NOTE_LETTER_INDEX = { c: 0, d: 1, e: 2, f: 3, g: 4, a: 5, b: 6 };

    const COURSES = {
      beginner: { min: 3, max: 29, minFret: 3, maxFret: 5 }, // 6弦 3F 〜 1弦 5F
      elementary: { min: 0, max: 36, minFret: 0, maxFret: 12 }, // 6弦開放 〜 1弦12F
      intermediate: { min: 0, max: 46, minFret: 0, maxFret: 22 }, // 6弦開放 〜 1弦22F
    };

    // 各弦の開放弦の半音インデックス（E3 = 0 基準）
    const STRING_OPEN_SEMITONES = {
      6: 0, // 6弦開放 (E3)
      5: 5, // 5弦開放 (A3)
      4: 10, // 4弦開放 (D4)
      3: 15, // 3弦開放 (G4)
      2: 19, // 2弦開放 (B4)
      1: 24, // 1弦開放 (E5)
    };

    // ピッチクラス（0:C 〜 11:B）ごとの音名・臨時記号マッピング
    const PITCH_DEFS = [
      [{ letter: "c", accidental: null }],
      [
        { letter: "c", accidental: "#" },
        { letter: "d", accidental: "b" },
      ],
      [{ letter: "d", accidental: null }],
      [
        { letter: "d", accidental: "#" },
        { letter: "e", accidental: "b" },
      ],
      [{ letter: "e", accidental: null }],
      [{ letter: "f", accidental: null }],
      [
        { letter: "f", accidental: "#" },
        { letter: "g", accidental: "b" },
      ],
      [{ letter: "g", accidental: null }],
      [
        { letter: "g", accidental: "#" },
        { letter: "a", accidental: "b" },
      ],
      [{ letter: "a", accidental: null }],
      [
        { letter: "a", accidental: "#" },
        { letter: "b", accidental: "b" },
      ],
      [{ letter: "b", accidental: null }],
    ];

    // 五線譜上で線に乗る音かを判定（偶数=線, 奇数=間）
    function checkIsLine(letter, octave) {
      const step = (octave - 4) * 7 + NOTE_LETTER_INDEX[letter];
      return Math.abs(step) % 2 === 0;
    }

    // 出題範囲内の全音符マスターリストを一度だけ生成
    const MASTER_NOTES = [];
    for (let s = 0; s <= 46; s++) {
      const absSemitone = s + 4; // E3 = C3 + 4半音
      const pitchClass = absSemitone % 12;
      const octave = Math.floor(absSemitone / 12) + 3;

      const freq = 440 * Math.pow(2, (absSemitone - 21) / 12);

      PITCH_DEFS[pitchClass].forEach((def) => {
        MASTER_NOTES.push({
          semitone: s,
          key: `${def.letter}/${octave}`,
          letter: def.letter,
          octave: octave,
          accidental: def.accidental,
          isNatural: def.accidental === null,
          isLine: checkIsLine(def.letter, octave),
          freq: freq,
        });
      });
    }

    // ==========================================
    // UI要素・状態管理
    // ==========================================
    const { Renderer, Stave, StaveNote, Accidental, Formatter, Voice } =
      Vex.Flow;

    const scoreArea = document.getElementById("scoreArea");
    const messageOverlay = document.getElementById("messageOverlay");
    const btnStart = document.getElementById("btnStart");
    const btnStop = document.getElementById("btnStop");
    const inputBpm = document.getElementById("bpm");
    const chkMuteSound = document.getElementById("muteSound");
    const inputTimerMinutes = document.getElementById("timerMinutes");
    const inputTimerSeconds = document.getElementById("timerSeconds");
    const timerDisplay = document.getElementById("timerDisplay");
    const chkShowDoremi = document.getElementById("showDoremi");
    const chkShowAlphabet = document.getElementById("showAlphabet");

    let metronomeTimerId = null;
    let countdownTimerId = null;
    let remainingSeconds = 0;
    let currentNoteData = null;
    let beatCount = 0;
    let audioCtx = null;
    let soundMasterGain = null;

    // ==========================================
    // 設定値の取得（一元化ヘルパー）
    // ==========================================
    function getAppSettings() {
      return {
        course:
          document.querySelector('input[name="course"]:checked')?.value ||
          "beginner",
        guitarString:
          document.querySelector('input[name="guitarString"]:checked')
            ?.value || "all",
        mode:
          document.querySelector('input[name="mode"]:checked')?.value ||
          "natural",
        lineSpace:
          document.querySelector('input[name="lineSpace"]:checked')?.value ||
          "all",
        maxInterval:
          document.querySelector('input[name="maxInterval"]:checked')
            ?.value || "all",
        noteCount: parseInt(
          document.querySelector('input[name="noteCount"]:checked')?.value ||
          "1",
          10,
        ),
        beatFreq: parseInt(
          document.querySelector('input[name="beatFreq"]:checked')?.value ||
          "2",
          10,
        ),
        soundType:
          document.querySelector('input[name="soundType"]:checked')?.value ||
          "click",
        isMuted: chkMuteSound ? chkMuteSound.checked : false,
      };
    }

    // ==========================================
    // 音符生成ロジック（データ駆動・O(1)抽出）
    // ==========================================
    function getRandomNotes() {
      const settings = getAppSettings();
      const course = COURSES[settings.course] || COURSES.beginner;

      // 音域（min 〜 max）の決定：弦指定がある場合はその弦の開放弦 + フレット範囲で計算
      let rangeMin = course.min;
      let rangeMax = course.max;

      if (
        settings.guitarString !== "all" &&
        STRING_OPEN_SEMITONES[settings.guitarString] !== undefined
      ) {
        const openS = STRING_OPEN_SEMITONES[settings.guitarString];
        rangeMin = openS + course.minFret;
        rangeMax = openS + course.maxFret;
      }

      // 設定条件に合致する音符群をフィルター
      const pool = MASTER_NOTES.filter((n) => {
        if (n.semitone < rangeMin || n.semitone > rangeMax) return false;
        if (settings.mode === "natural" && !n.isNatural) return false;
        if (settings.lineSpace === "line" && !n.isLine) return false;
        if (settings.lineSpace === "space" && n.isLine) return false;
        return true;
      });

      if (pool.length === 0) {
        const fallbackSemi =
          STRING_OPEN_SEMITONES[settings.guitarString] ?? 8;
        const fallbackNote = MASTER_NOTES.find(
          (n) => n.semitone === fallbackSemi,
        ) || {
          key: "c/4",
          accidental: null,
          letter: "c",
          semitone: 8,
          freq: 261.63,
        };
        return [fallbackNote];
      }

      const pickRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];

      if (settings.noteCount === 1 || settings.maxInterval === "all") {
        return Array.from({ length: settings.noteCount }, () =>
          pickRandom(pool),
        );
      }

      // 1オクターブ（12半音）制限の処理
      const notes = [];
      const firstNote = pickRandom(pool);
      notes.push(firstNote);

      let minS = firstNote.semitone;
      let maxS = firstNote.semitone;

      for (let i = 1; i < settings.noteCount; i++) {
        const validCandidates = pool.filter((n) => {
          const newMin = Math.min(minS, n.semitone);
          const newMax = Math.max(maxS, n.semitone);
          return newMax - newMin <= 12;
        });

        const next =
          validCandidates.length > 0
            ? pickRandom(validCandidates)
            : firstNote;
        minS = Math.min(minS, next.semitone);
        maxS = Math.max(maxS, next.semitone);
        notes.push(next);
      }

      return notes;
    }

    // ==========================================
    // 描画ロジック（五線譜・文字ラベルの分離）
    // ==========================================
    function drawStaff(notesData = null) {
      currentNoteData = notesData;
      scoreArea.innerHTML = "";

      const notesList = notesData
        ? Array.isArray(notesData)
          ? notesData
          : [notesData]
        : [];
      const count = notesList.length > 0 ? notesList.length : 1;
      const canvasWidth = 280;
      const canvasHeight = 265;
      const staveWidth = 260;

      const renderer = new Renderer(scoreArea, Renderer.Backends.SVG);
      renderer.resize(canvasWidth, canvasHeight);
      const context = renderer.getContext();

      const svgElement = scoreArea.querySelector("svg");
      if (svgElement) {
        svgElement.setAttribute(
          "viewBox",
          `0 0 ${canvasWidth} ${canvasHeight}`,
        );
        svgElement.removeAttribute("width");
        svgElement.removeAttribute("height");
      }

      const stave = new Stave(10, 68, staveWidth);
      stave.addClef("treble");
      stave.addTimeSignature("4/4");
      const baseNoteStartX = stave.getNoteStartX() + 12;

      if (notesList.length === 0) {
        stave.setNoteStartX(baseNoteStartX);
        stave.setContext(context).draw();
        return;
      }

      try {
        const staveNotes = notesList.map((n) => {
          const sn = new StaveNote({
            clef: "treble",
            keys: [n.key],
            duration: "w",
          });
          if (n.accidental) sn.addModifier(new Accidental(n.accidental), 0);
          return sn;
        });

        if (count === 1) {
          let shift = 0;
          if (notesList[0].accidental === "b") shift = 0.95472;
          else if (!notesList[0].accidental) shift = 16.08072;

          stave.setNoteStartX(baseNoteStartX + shift);
          stave.setContext(context).draw();
          staveNotes[0].setStave(stave);

          const voice = new Voice({ num_beats: 4, beat_value: 4 }).setMode(
            Voice.Mode.SOFT,
          );
          voice.addTickable(staveNotes[0]);
          new Formatter().joinVoices([voice]).format([voice], 80);
          voice.draw(context, stave);
        } else {
          stave.setNoteStartX(baseNoteStartX);
          stave.setContext(context).draw();
          staveNotes.forEach((sn) => sn.setStave(stave));

          const voice = new Voice({
            num_beats: 4 * count,
            beat_value: 4,
          }).setMode(Voice.Mode.SOFT);
          staveNotes.forEach((sn) => voice.addTickable(sn));

          const availableWidth = staveWidth - stave.getNoteStartX() - 15;
          new Formatter().joinVoices([voice]).format([voice], availableWidth);
          voice.draw(context, stave);
        }

        // 文字表示（ドレミ・C）を描画
        drawNoteLabels(svgElement, stave, staveNotes, notesList);
      } catch (e) {
        console.error("楽譜描画エラー:", e);
      }
    }

    function drawNoteLabels(svg, stave, staveNotes, notesList) {
      if (!svg || (!chkShowDoremi.checked && !chkShowAlphabet.checked))
        return;

      const lowestNoteY =
        typeof stave.getYForLine === "function"
          ? stave.getYForLine(7.5)
          : 143;
      const doremiY = Math.round(lowestNoteY + 36);
      const alphabetY = Math.round(lowestNoteY + 58);

      staveNotes.forEach((sn, idx) => {
        const nData = notesList[idx];
        const accSym = nData.accidental
          ? ACCIDENTAL_SYMBOLS[nData.accidental] || ""
          : "";
        let noteCenterX = 125;

        try {
          const heads = sn.getNoteHeads ? sn.getNoteHeads() : sn.note_heads;
          if (heads && heads.length > 0) {
            const h = heads[0];
            const hX = typeof h.getX === "function" ? h.getX() : h.x;
            const hW =
              typeof h.getWidth === "function"
                ? h.getWidth()
                : h.width || 15.5;
            if (typeof hX === "number" && hX > 0) noteCenterX = hX + hW / 2;
          } else if (typeof sn.getAbsoluteX === "function") {
            noteCenterX = sn.getAbsoluteX() + 7.75;
          }
        } catch (e) { }

        const appendSvgText = (text, y) => {
          const el = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text",
          );
          el.setAttribute("x", noteCenterX);
          el.setAttribute("y", y);
          el.setAttribute("text-anchor", "middle");
          el.setAttribute("font-size", "14");
          el.setAttribute("font-weight", "bold");
          el.setAttribute("fill", "#2c3e50");
          el.setAttribute(
            "font-family",
            "'Helvetica Neue', Arial, sans-serif",
          );
          el.textContent = text;
          svg.appendChild(el);
        };

        if (chkShowDoremi.checked)
          appendSvgText((DOREMI_MAP[nData.letter] || "") + accSym, doremiY);
        if (chkShowAlphabet.checked)
          appendSvgText(nData.letter.toUpperCase() + accSym, alphabetY);
      });
    }

    // ==========================================
    // 音声（Web Audio API）
    // ==========================================
    function isMuted() {
      return chkMuteSound ? chkMuteSound.checked : false;
    }

    function getSoundMasterGain() {
      if (!audioCtx)
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      if (!soundMasterGain) {
        soundMasterGain = audioCtx.createGain();
        soundMasterGain.connect(audioCtx.destination);
      }
      soundMasterGain.gain.setValueAtTime(
        isMuted() ? 0 : 1,
        audioCtx.currentTime,
      );
      return soundMasterGain;
    }

    function handleMuteChange() {
      if (soundMasterGain && audioCtx) {
        soundMasterGain.gain.cancelScheduledValues(audioCtx.currentTime);
        soundMasterGain.gain.setValueAtTime(
          isMuted() ? 0 : 1,
          audioCtx.currentTime,
        );
      }
    }

    function playClick() {
      if (isMuted()) return;

      const master = getSoundMasterGain();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(master);

      osc.type = "triangle";
      osc.frequency.setValueAtTime(261.63, audioCtx.currentTime); // C4音
      gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioCtx.currentTime + 0.1,
      );

      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.1);
    }

    function playTone(freq, startTime, duration) {
      const master = getSoundMasterGain();

      // 1. 基音（サイン波：太く芯のある温かい低中音）
      const oscMain = audioCtx.createOscillator();
      oscMain.type = "sine";
      oscMain.frequency.setValueAtTime(freq, startTime);

      // 2. アタック用倍音（三角波：弦を弾いた瞬間の輪郭・爪弾き感をプラス）
      const oscHarmonic = audioCtx.createOscillator();
      oscHarmonic.type = "triangle";
      oscHarmonic.frequency.setValueAtTime(freq, startTime);

      // 3. ローパスフィルター（電子音特有のピコピコした高域成分をカット）
      const filter = audioCtx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(Math.min(freq * 3.2, 2400), startTime);

      // 基音のエンベロープ（ふくよかに立ち上がり、自然に減衰）
      const gainMain = audioCtx.createGain();
      gainMain.gain.setValueAtTime(0.0001, startTime);
      gainMain.gain.exponentialRampToValueAtTime(0.4, startTime + 0.02);
      gainMain.gain.exponentialRampToValueAtTime(
        0.0001,
        startTime + duration,
      );

      // アタック倍音のエンベロープ（弾いた瞬間だけ鳴り、サッと消えて余韻を邪魔しない）
      const gainHarmonic = audioCtx.createGain();
      gainHarmonic.gain.setValueAtTime(0.0001, startTime);
      gainHarmonic.gain.exponentialRampToValueAtTime(0.12, startTime + 0.015);
      gainHarmonic.gain.exponentialRampToValueAtTime(
        0.0001,
        startTime + Math.min(0.18, duration * 0.35),
      );

      oscMain.connect(gainMain);
      oscHarmonic.connect(gainHarmonic);

      gainMain.connect(filter);
      gainHarmonic.connect(filter);
      filter.connect(master);

      oscMain.start(startTime);
      oscHarmonic.start(startTime);
      oscMain.stop(startTime + duration);
      oscHarmonic.stop(startTime + duration);
    }

    function playNotesArpeggio(notesData) {
      if (isMuted()) return;
      const notes = Array.isArray(notesData) ? notesData : [notesData];
      if (notes.length === 0) return;

      getSoundMasterGain();

      const bpm = parseInt(inputBpm.value, 10) || 50;
      const beatSec = 60 / bpm;
      const count = notes.length;

      // アルペジオ間隔：テンポが速い時は収まるように自動短縮、基本約0.08秒間隔
      const delay =
        count <= 1 ? 0 : Math.min(0.08, (beatSec * 0.45) / (count - 1));
      const duration = Math.max(0.6, beatSec * 0.9);
      const now = audioCtx.currentTime;

      notes.forEach((n, idx) => {
        if (!n || typeof n.freq !== "number") return;
        const startTime = now + idx * delay;
        playTone(n.freq, startTime, duration);
      });
    }

    // ==========================================
    // タイマー・メトロノーム制御
    // ==========================================
    function formatTime(totalSeconds) {
      const m = Math.floor(totalSeconds / 60)
        .toString()
        .padStart(2, "0");
      const s = (totalSeconds % 60).toString().padStart(2, "0");
      return `${m}分:${s}秒`;
    }

    function updateInitialTimerDisplay() {
      if (btnStart.disabled) return;
      const mins = parseInt(inputTimerMinutes.value, 10) || 0;
      const secs = parseInt(inputTimerSeconds.value, 10) || 0;
      const total = mins * 60 + secs;
      timerDisplay.textContent = total <= 0 ? "--分:--秒" : formatTime(total);
    }

    function setInputsDisabled(disabled) {
      // 設定パネル内の全inputを一括制御（ミュートは演奏中も切り替え可能にする）
      document.querySelectorAll(".card input").forEach((input) => {
        if (input.id === "muteSound") return;
        input.disabled = disabled;
      });
    }

    function tick() {
      drawStaff(getRandomNotes());
    }

    function metronomeTick() {
      const settings = getAppSettings();
      const isFirstBeat = beatCount % settings.beatFreq === 0;
      if (isFirstBeat) tick();

      if (settings.soundType === "click") {
        playClick();
      } else if (settings.soundType === "pitch") {
        // 「1拍目」だけ実音（アルペジオ）、2拍目以降は余韻（発音しない）
        if (isFirstBeat && currentNoteData) {
          playNotesArpeggio(currentNoteData);
        }
      }

      beatCount++;
    }

    function finishTimer() {
      stop();
      const msg =
        finishMessages[Math.floor(Math.random() * finishMessages.length)];
      messageOverlay.textContent = msg;
      messageOverlay.classList.remove("hidden");
    }

    function start() {
      messageOverlay.classList.add("hidden");

      let bpm = parseInt(inputBpm.value, 10);
      if (isNaN(bpm) || bpm < 30) bpm = 30;
      if (bpm > 240) bpm = 240;
      inputBpm.value = bpm;

      btnStart.disabled = true;
      btnStop.disabled = false;
      setInputsDisabled(true);

      if (!audioCtx)
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();

      // マスターゲインに現在のミュート状態を適用
      getSoundMasterGain();

      const mins = parseInt(inputTimerMinutes.value, 10) || 0;
      const secs = parseInt(inputTimerSeconds.value, 10) || 0;
      const totalSeconds = mins * 60 + secs;

      if (totalSeconds > 0) {
        remainingSeconds = totalSeconds;
        timerDisplay.textContent = formatTime(remainingSeconds);
        countdownTimerId = setInterval(() => {
          remainingSeconds--;
          timerDisplay.textContent = formatTime(remainingSeconds);
          if (remainingSeconds <= 0) finishTimer();
        }, 1000);
      } else {
        timerDisplay.textContent = "--分:--秒";
      }

      beatCount = 0;
      metronomeTick();

      const msPerBeat = Math.floor(60000 / bpm);
      metronomeTimerId = setInterval(metronomeTick, msPerBeat);
    }

    function stop() {
      if (metronomeTimerId) {
        clearInterval(metronomeTimerId);
        metronomeTimerId = null;
      }
      if (countdownTimerId) {
        clearInterval(countdownTimerId);
        countdownTimerId = null;
      }

      // 演奏停止時に鳴りかけの音を速やかに消音
      if (soundMasterGain && audioCtx) {
        soundMasterGain.gain.cancelScheduledValues(audioCtx.currentTime);
        soundMasterGain.gain.setValueAtTime(0, audioCtx.currentTime);
        soundMasterGain.gain.setValueAtTime(
          isMuted() ? 0 : 1,
          audioCtx.currentTime + 0.05,
        );
      }

      btnStart.disabled = false;
      btnStop.disabled = true;
      setInputsDisabled(false);

      drawStaff(null);
    }

    // ==========================================
    // イベントリスナー登録
    // ==========================================
    btnStart.addEventListener("click", start);
    btnStop.addEventListener("click", stop);
    chkMuteSound.addEventListener("change", handleMuteChange);

    inputTimerMinutes.addEventListener("input", updateInitialTimerDisplay);
    inputTimerSeconds.addEventListener("input", updateInitialTimerDisplay);

    chkShowDoremi.addEventListener("change", () => {
      if (currentNoteData) drawStaff(currentNoteData);
    });
    chkShowAlphabet.addEventListener("change", () => {
      if (currentNoteData) drawStaff(currentNoteData);
    });

    // 初期化：空の五線譜を描画
    drawStaff(null);
  </script>
</body>

</html>
